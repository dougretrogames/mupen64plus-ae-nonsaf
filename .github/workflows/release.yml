name: Mupen64Plus-AE Release

on: 
  push:
  pull_request:
  workflow_dispatch: 

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'adopt'
        cache: 'gradle' 

    - uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386

    - name: Set up environment variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk

    - name: Install Android build-tools
      run: |
        yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platforms;android-33" "build-tools;33.0.2" "platform-tools"

    - name: Decode Keystore
      run: |
        mkdir -p keystore
        echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > keystore/release.keystore

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

    - name: Verify and Sign release APK
      run: |
        BUILD_TOOLS_DIR=$(ls -d "${ANDROID_SDK_ROOT}/build-tools/"* | sort -V | tail -n1)
        APK_DIR=app/build/outputs/apk/release
        APK_FILE=$(ls "$APK_DIR"/Mupen64PlusAE-release.apk 2>/dev/null || ls "$APK_DIR"/*.apk 2>/dev/null | head -n1)
        
        if [ -f "$APK_FILE" ]; then
          "$BUILD_TOOLS_DIR"/apksigner sign --ks keystore/release.keystore --ks-pass pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }} --out "$APK_DIR"/Mupen64PlusAE-release-signed.apk "$APK_FILE"
        else
          echo "No APK found to sign"
          exit 1
        fi

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: mupen64plus-ae-release-${{ env.SHORT_SHA }}
        path: ${{ github.workspace }}/app/build/outputs/apk/release/Mupen64PlusAE-release-signed.apk
